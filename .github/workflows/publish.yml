# The ONLY routine live publisher. Local runs need --live AND --confirm, and if
# you also enable the launchd job, disable this one — two schedulers racing is
# what the lease exists to survive, not something to invite.
name: publish

on:
  schedule:
    # Staggered off the hour: GitHub's scheduler is busiest at :00 and delays
    # runs there, and the 15-30 minute SLA has no room for that.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# Never cancel a run that may be mid-publish: cancelling between an API's 2xx
# and our _State write is exactly how a post gets published twice.
concurrency:
  group: postpilot-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      META_PAGE_TOKEN_GRANDINVITATION: ${{ secrets.META_PAGE_TOKEN_GRANDINVITATION }}
      # One token covers every Company Page — only the org URN is per brand.
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
      LINKEDIN_TOKEN_EXPIRES: ${{ secrets.LINKEDIN_TOKEN_EXPIRES }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # ffmpeg and ffprobe are preinstalled on ubuntu-latest; `doctor` checks.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Publish
        run: uv run postpilot publish --live --confirm 2>&1 | tee run.log

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publish-log-${{ github.run_id }}
          # Tokens are redacted by postpilot.logging before anything is
          # printed, so this artifact is safe to keep.
          path: run.log
          retention-days: 7
