# GitHub disables scheduled workflows after 60 days without repository
# activity, and it does so SILENTLY. A scheduler that quietly stops scheduling
# is this project's worst failure mode, so a monthly commit keeps it alive.
name: keepalive

on:
  schedule:
    - cron: "0 3 1 * *"   # 03:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Empty commit
        run: |
          git config user.name "postpilot-keepalive"
          git config user.email "noreply@github.com"
          git commit --allow-empty -m "chore: keepalive so scheduled workflows stay enabled"
          git push
