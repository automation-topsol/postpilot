[project]
name = "postpilot"
version = "0.1.0"
description = "Google-Sheet-driven social media scheduler for Facebook Pages, Instagram Business accounts and LinkedIn Company Pages."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # CLI + output
    "typer>=0.15",
    "rich>=13.9",
    # models / config
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # HTTP
    "httpx>=0.28",
    # Google
    "gspread>=6.1",
    "google-auth>=2.36",
    "google-api-python-client>=2.155",
    # Cloudflare R2 (S3-compatible)
    "boto3>=1.35",
    # media
    "pillow>=11.0",
]

[project.scripts]
postpilot = "postpilot.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
    "freezegun>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["postpilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# No test may touch a real API or Google; fakes and respx only.
markers = ["integration: talks to a real service (never run in CI)"]
